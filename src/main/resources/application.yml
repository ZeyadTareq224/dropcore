spring:
  application:
    name: dropcore
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:dropcore}
    username: ${DB_USER:dropcore}
    password: ${DB_PASSWORD:local-dev-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  flyway:
    enabled: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
dropcore:
  reservations:
    hold-duration: PT5M
