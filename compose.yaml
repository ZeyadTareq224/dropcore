services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dropcore
      POSTGRES_USER: dropcore
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropcore -d dropcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dropcore_pgdata:/var/lib/postgresql/data
volumes:
  dropcore_pgdata:
